server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serves pre-compressed .gz siblings when present (see dockerfile / docker-entrypoint.sh)
    # at zero request-time CPU cost; falls back to on-the-fly gzip below for anything
    # without one.
    gzip_static on;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # SPA routing - all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed static assets
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html - it must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
