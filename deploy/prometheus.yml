global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: windows_exporter
    http_sd_configs:
      - url: http://wimp-control-plane:8080/prometheus/targets
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
