apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wimp.cpFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wimp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wimp.cpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wimp.cpSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: wimp-control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # ── App ──────────────────────────────────────────
            - name: APPENV
              value: {{ .Values.config.appEnv | quote }}
            - name: APPURL
              value: {{ .Values.appUrl | quote }}
            - name: WEBURL
              value: {{ .Values.webUrl | default "" | quote }}
            - name: APPPORT
              value: {{ .Values.service.port | toString | quote }}
            - name: AGENTVERSION
              value: {{ .Values.config.agentVersion | quote }}
            - name: AUTOUPDATEAGENT
              value: {{ .Values.config.autoUpdateAgent | toString | quote }}
            - name: ENFORCEMFA
              value: {{ .Values.config.enforceMfa | toString | quote }}

            # ── Auth ─────────────────────────────────────────
            - name: JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: jwt-secret
            - name: BOOTSTRAPTOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: bootstrap-token
            - name: DEFAULTADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: admin-username
            - name: DEFAULTADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: admin-password

            # ── Database ─────────────────────────────────────
            - name: DATABASETYPE
              value: {{ .Values.config.database.type | quote }}
            - name: DATABASEPATH
              value: {{ .Values.config.database.path | default "" | quote }}
            - name: DATABASEHOST
              value: {{ .Values.config.database.host | default "" | quote }}
            - name: DATABASEPORT
              value: {{ .Values.config.database.port | default "" | quote }}
            - name: DATABASENAME
              value: {{ .Values.config.database.name | default "" | quote }}
            - name: DATABASEUSERNAME
              value: {{ .Values.config.database.username | default "" | quote }}
            - name: DATABASEPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: db-password
            - name: DATABASEUSESSL
              value: {{ .Values.config.database.useSsl | toString | quote }}

            # ── Alertmanager ─────────────────────────────────
            - name: ALERTMANAGERURL
              value: {{ .Values.config.alertmanagerUrl | default "" | quote }}

            # ── Prometheus ───────────────────────────────────
            - name: PROMETHEUSURL
              value: {{ .Values.config.prometheusUrl | default "" | quote }}

            # ── SQL Server monitoring ──────────────────────
            - name: SQLMONITORUSERNAME
              value: {{ .Values.config.sqlMonitor.username | default "" | quote }}
            - name: SQLMONITORPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wimp.fullname" . }}
                  key: sql-monitor-password

            # ── Alerts ───────────────────────────────────────
            - name: ALERTSEVERITY_MACHINECONNECTED
              value: {{ .Values.config.alerts.severity.machineConnected | quote }}
            - name: ALERTSEVERITY_MACHINEDISCONNECTED
              value: {{ .Values.config.alerts.severity.machineDisconnected | quote }}
            - name: ALERTSEVERITY_MACHINERESTARTING
              value: {{ .Values.config.alerts.severity.machineRestarting | quote }}
            - name: ALERTSEVERITY_AGENTUPDATED
              value: {{ .Values.config.alerts.severity.agentUpdated | quote }}
            - name: ALERTSEVERITY_MACHINEREASSIGNED
              value: {{ .Values.config.alerts.severity.machineReassigned | quote }}
            - name: ALERTSEVERITY_APPPOOLSTOPPED
              value: {{ .Values.config.alerts.severity.appPoolStopped | quote }}
            - name: ALERTSEVERITY_APPPOOLSTARTED
              value: {{ .Values.config.alerts.severity.appPoolStarted | quote }}
            - name: ALERTSEVERITY_SITESTOPPED
              value: {{ .Values.config.alerts.severity.siteStopped | quote }}
            - name: ALERTSEVERITY_SITESTARTED
              value: {{ .Values.config.alerts.severity.siteStarted | quote }}
            - name: ALERTSEVERITY_WINDOWSEXPORTERDOWN
              value: {{ .Values.config.alerts.severity.windowsExporterDown | quote }}
            - name: ALERTSEVERITY_WINDOWSEXPORTERUP
              value: {{ .Values.config.alerts.severity.windowsExporterUp | quote }}
            - name: ALERTSEVERITY_FLUENTBITDOWN
              value: {{ .Values.config.alerts.severity.fluentBitDown | quote }}
            - name: ALERTSEVERITY_FLUENTBITUP
              value: {{ .Values.config.alerts.severity.fluentBitUp | quote }}
            - name: ALERTSEVERITY_HEALTHCHECKDOWN
              value: {{ .Values.config.alerts.severity.healthCheckDown | quote }}
            - name: ALERTSEVERITY_HEALTHCHECKUP
              value: {{ .Values.config.alerts.severity.healthCheckUp | quote }}
            - name: ALERTSEVERITY_HEALTHCHECKSLOW
              value: {{ .Values.config.alerts.severity.healthCheckSlow | quote }}
            - name: ALERTSEVERITY_HEALTHCHECKSLOWRECOVERED
              value: {{ .Values.config.alerts.severity.healthCheckSlowRecovered | quote }}
            - name: ALERTSEVERITY_HIGHCPU
              value: {{ .Values.config.alerts.severity.highCpu | quote }}
            - name: ALERTSEVERITY_HIGHCPURECOVERED
              value: {{ .Values.config.alerts.severity.highCpuRecovered | quote }}
            - name: ALERTSEVERITY_HIGHMEMORY
              value: {{ .Values.config.alerts.severity.highMemory | quote }}
            - name: ALERTSEVERITY_HIGHMEMORYRECOVERED
              value: {{ .Values.config.alerts.severity.highMemoryRecovered | quote }}
            - name: ALERTSEVERITY_LOWDISK
              value: {{ .Values.config.alerts.severity.lowDisk | quote }}
            - name: ALERTSEVERITY_LOWDISKRECOVERED
              value: {{ .Values.config.alerts.severity.lowDiskRecovered | quote }}
            - name: ALERTSEVERITY_SQLINSTANCESTOPPED
              value: {{ .Values.config.alerts.severity.sqlInstanceStopped | quote }}
            - name: ALERTSEVERITY_SQLINSTANCESTARTED
              value: {{ .Values.config.alerts.severity.sqlInstanceStarted | quote }}
            - name: ALERTSEVERITY_SQLAGENTSTOPPED
              value: {{ .Values.config.alerts.severity.sqlAgentStopped | quote }}
            - name: ALERTSEVERITY_SQLAGENTSTARTED
              value: {{ .Values.config.alerts.severity.sqlAgentStarted | quote }}
            - name: ALERTSEVERITY_SQLINSTANCEFAILOVER
              value: {{ .Values.config.alerts.severity.sqlInstanceFailover | quote }}
            - name: ALERTSEVERITY_SQLAGFAILOVER
              value: {{ .Values.config.alerts.severity.sqlAgFailover | quote }}
            - name: ALERTSEVERITY_SQLDATABASEUNHEALTHY
              value: {{ .Values.config.alerts.severity.sqlDatabaseUnhealthy | quote }}
            - name: ALERTSEVERITY_SQLDATABASERECOVERED
              value: {{ .Values.config.alerts.severity.sqlDatabaseRecovered | quote }}
            - name: ALERTSEVERITY_SQLBACKUPOVERDUE
              value: {{ .Values.config.alerts.severity.sqlBackupOverdue | quote }}
            - name: ALERTSEVERITY_SQLBACKUPRECOVERED
              value: {{ .Values.config.alerts.severity.sqlBackupRecovered | quote }}
            - name: ALERTSEVERITY_SQLLOGBACKUPOVERDUE
              value: {{ .Values.config.alerts.severity.sqlLogBackupOverdue | quote }}
            - name: ALERTSEVERITY_SQLLOGBACKUPRECOVERED
              value: {{ .Values.config.alerts.severity.sqlLogBackupRecovered | quote }}
            - name: ALERTSEVERITY_SQLJOBFAILED
              value: {{ .Values.config.alerts.severity.sqlJobFailed | quote }}
            - name: ALERTSEVERITY_SQLJOBRECOVERED
              value: {{ .Values.config.alerts.severity.sqlJobRecovered | quote }}
            - name: ALERTSEVERITY_SQLAGUNHEALTHY
              value: {{ .Values.config.alerts.severity.sqlAgUnhealthy | quote }}
            - name: ALERTSEVERITY_SQLAGHEALTHY
              value: {{ .Values.config.alerts.severity.sqlAgHealthy | quote }}
            - name: ALERTSEVERITY_SQLBLOCKING
              value: {{ .Values.config.alerts.severity.sqlBlocking | quote }}
            - name: ALERTSEVERITY_SQLBLOCKINGCLEARED
              value: {{ .Values.config.alerts.severity.sqlBlockingCleared | quote }}
            - name: ALERTSEVERITY_CLUSTERNODEDOWN
              value: {{ .Values.config.alerts.severity.clusterNodeDown | quote }}
            - name: ALERTSEVERITY_CLUSTERNODEUP
              value: {{ .Values.config.alerts.severity.clusterNodeUp | quote }}
            - name: THRESHOLD_HIGHCPU_PERCENT
              value: {{ .Values.config.alerts.threshold.highCpuPercent | toString | quote }}
            - name: THRESHOLD_HIGHMEMORY_PERCENT
              value: {{ .Values.config.alerts.threshold.highMemoryPercent | toString | quote }}
            - name: THRESHOLD_LOWDISK_PERCENT
              value: {{ .Values.config.alerts.threshold.lowDiskPercent | toString | quote }}
            - name: THRESHOLD_SQL_BACKUP_HOURS
              value: {{ .Values.config.alerts.threshold.sqlBackupHours | toString | quote }}
            - name: THRESHOLD_SQL_LOG_BACKUP_MINUTES
              value: {{ .Values.config.alerts.threshold.sqlLogBackupMinutes | toString | quote }}
            - name: THRESHOLD_SQL_BLOCKING_SECONDS
              value: {{ .Values.config.alerts.threshold.sqlBlockingSeconds | toString | quote }}
            - name: THRESHOLD_HEALTHCHECK_SLOW_SECONDS
              value: {{ .Values.config.alerts.threshold.healthCheckSlowSeconds | toString | quote }}
            - name: HEALTHCHECK_TIMEOUT_SECONDS
              value: {{ .Values.config.healthCheckTimeoutSeconds | toString | quote }}
            - name: ALERTRECEIVERMINSEVERITY
              value: {{ .Values.config.alerts.receiverMinSeverity | quote }}

            # ── Loki ─────────────────────────────────────────
            - name: LOKIHOST
              value: {{ include "wimp.lokiHost" . | quote }}
            - name: LOKIPORT
              value: {{ .Values.config.lokiPort | default "" | quote }}
            - name: LOKITLSENABLED
              value: {{ .Values.config.lokiTlsEnabled | toString | quote }}
            - name: LOKITLSSKIPVERIFY
              value: {{ .Values.config.lokiTlsSkipVerify | toString | quote }}

          {{- if and .Values.persistence.enabled (eq .Values.config.database.type "sqlite") }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}

      {{- if and .Values.persistence.enabled (eq .Values.config.database.type "sqlite") }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wimp.cpFullname" . }}-data
      {{- end }}
