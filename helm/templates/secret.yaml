{{/*
Secrets are generated once and persisted across upgrades via lookup.
If the Secret already exists, its values are reused so tokens don't rotate.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "wimp.fullname" .)) }}
{{- $jwtSecret := "" }}
{{- $bootstrapToken := "" }}
{{- if $existing }}
{{-   $jwtSecret      = index $existing.data "jwt-secret"      | b64dec }}
{{-   $bootstrapToken = index $existing.data "bootstrap-token" | b64dec }}
{{- else }}
{{-   $jwtSecret      = .Values.config.jwtSecret      | default (randAlphaNum 48) }}
{{-   $bootstrapToken = .Values.config.bootstrapToken | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wimp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wimp.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ $jwtSecret | quote }}
  bootstrap-token: {{ $bootstrapToken | quote }}
  admin-email: {{ .Values.config.defaultAdminEmail | quote }}
  admin-password: {{ .Values.config.defaultAdminPassword | quote }}
  db-password: {{ .Values.config.database.password | quote }}
