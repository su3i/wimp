apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wimp.webFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wimp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "wimp.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wimp.webSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: wimp-web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: VITE_API_BASE_URL
              value: {{ .Values.web.apiUrl | default "" | quote }}
            - name: VITE_PROMETHEUS_URL
              value: {{ .Values.web.prometheusUrl | default "" | quote }}
