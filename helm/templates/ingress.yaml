    {{- include "wimp.labels" . | nindent 4 }}
  {{- with .Values.web.ingress.className }}
  annotations:
    kubernetes.io/ingress.class: {{ . | quote }}
  {{- end }}
spec:
  {{- with .Values.web.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.web.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.web.ingress.host | quote }}
      secretName: {{ .Values.web.ingress.tls.secretName | default (printf "%s-tls" (include "wimp.webFullname" .)) | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.web.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wimp.webFullname" . }}
                port:
                  name: http
{{- end }}
