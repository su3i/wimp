apiVersion: v2
name: wimp
description: Windows Infrastructure Management Platform - control plane, web frontend, and optional observability stack
type: application
version: 0.0.15
appVersion: "0.0.30"

dependencies:
  - name: loki
    version: "17.4.1"
    repository: "oci://ghcr.io/grafana-community/helm-charts"
    condition: loki.enabled

  - name: kube-prometheus-stack
    version: ">=60.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled
