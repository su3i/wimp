# ──────────────────────────────────────────────────────────────
# WIMP control-plane
# ──────────────────────────────────────────────────────────────

# Public URL of the control plane - used by agents to connect back and by the web frontend.
# Set this after deploy once you have the LoadBalancer EXTERNAL-IP:
#   kubectl get svc wimp-control-plane -n <namespace>
# e.g. http://1.2.3.4:80
appUrl: ""

# Public URL of the web frontend (browser-facing) - NOT the same as appUrl above, since
# frontend and control plane commonly live behind different LoadBalancers/ingresses.
# Used to build deep links in outbound alerts (e.g. Telegram). Leave empty to omit
# links from alerts. Find it the same way as appUrl, but for the web service:
#   kubectl get svc wimp-web -n <namespace>
webUrl: ""

image:
  repository: darksueii/wimp
  tag: "0.0.30"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer  # LoadBalancer | NodePort | ClusterIP
  port: 80
  # nodePort: 30000   # only when type: NodePort

ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

persistence:
  enabled: false  # SQLite data directory - not needed when database.type is postgres
  storageClass: ""
  size: 2Gi

config:
  appEnv: production
  agentVersion: "0.0.5"
  autoUpdateAgent: false
  enforceMfa: false

  # REQUIRED - generate strong random values before deploying
  jwtSecret: ""       # e.g. openssl rand -hex 32
  bootstrapToken: ""  # e.g. openssl rand -hex 16

  defaultAdminUsername: "admin"
  defaultAdminPassword: ""  # REQUIRED

  # Alertmanager webhook URL - leave empty to disable external alerting.
  # When kube-prometheus-stack.enabled=true (below), use:
  #   http://<release>-kube-prometheus-stack-alertmanager.<namespace>.svc:9093
  alertmanagerUrl: ""

  # Prometheus URL used by the monitor uptime checker and the CPU/memory/disk metrics
  # checker - leave empty to disable both.
  # When kube-prometheus-stack.enabled=true (below), use the cluster-internal address:
  #   http://<release>-kube-prometheus-stack-prometheus.<namespace>.svc:9090
  prometheusUrl: ""

  alerts:
    # Per-alert-type severity override. Values: info | warning | critical | sev | disabled
    # ("disabled" = the event is never even created). Pre-filled with the built-in
    # default from internal/domain/notification/alert_types.go - edit any line to change it.
    severity:
      machineConnected: info
      machineDisconnected: critical
      machineShutdown: info
      machineRestarting: info
      agentUpdated: info
      appPoolStopped: warning
      appPoolStarted: info
      siteStopped: warning
      siteStarted: info
      windowsExporterDown: warning
      windowsExporterUp: info
      fluentBitDown: warning
      fluentBitUp: info
      healthCheckDown: sev
      healthCheckUp: info
      highCpu: critical
      highCpuRecovered: info
      highMemory: critical
      highMemoryRecovered: info
      lowDisk: critical
      lowDiskRecovered: info

    # Numeric thresholds for the metric-based alerts, pre-filled with the hardcoded
    # default from internal/application/metrics/checker.go.
    threshold:
      highCpuPercent: 95
      highMemoryPercent: 95
      lowDiskPercent: 5  # alert fires when free space drops BELOW this

    # Only alerts at or above this severity are forwarded to Alertmanager (everything
    # non-disabled is still stored/shown in-app regardless).
    receiverMinSeverity: critical

  database:
    type: postgres  # "sqlite" | "postgres"

    # SQLite - only when type: sqlite
    path: /data/app.db

    # Postgres - only when type: postgres (REQUIRED when using postgres)
    host: ""
    port: "5432"
    name: ""
    username: ""
    password: ""
    useSsl: false

  # Loki connection - leave empty to disable log shipping.
  # When loki.enabled=true (below), use: <release>-loki (cluster-internal, same namespace)
  lokiHost: ""
  lokiPort: "3100"
  lokiTlsEnabled: false
  lokiTlsSkipVerify: false

# ──────────────────────────────────────────────────────────────
# WIMP web (frontend)
# ──────────────────────────────────────────────────────────────
web:
  image:
    repository: darksueii/wimp-web
    tag: "0.0.30"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: LoadBalancer  # LoadBalancer | NodePort | ClusterIP
    port: 80
    # nodePort: 30001  # only when type: NodePort

  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""

  # REQUIRED - public URL of the control plane reachable from the user's browser.
  # Same value as appUrl above (or wherever the control plane is exposed).
  apiUrl: ""
  # Optional - public URL of Prometheus reachable from the user's browser.
  # Enables the metrics page in the UI.
  # When kube-prometheus-stack.enabled=true, expose the prometheus service and set its URL here.
  prometheusUrl: ""

# ──────────────────────────────────────────────────────────────
# Loki (log aggregation)
# Set enabled: true for an all-in-one install.
# Set enabled: false and point config.lokiHost to your own Loki.
# ──────────────────────────────────────────────────────────────
loki:
  enabled: true
  ignoreMinioDeprecation: true

  loki:
    auth_enabled: false

    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      s3:
        # Only set this if using your own S3/minio (and set loki.minio.enabled: false).
        # endpoint: ""
        s3forcepathstyle: true
        insecure: true

    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      # Required for the "Clear Logs" feature (internal/infrastructure/server/handlers/
      # logs.go) to work - without this, Loki rejects delete requests. deletion_mode
      # lives here (not under compactor) as of Loki 2.6+.
      deletion_mode: filter-and-delete
    ruler:
      enable_api: true

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3   # matches storage.type above

  minio:
    enabled: true
  gateway:
    enabled: false

  deploymentMode: Monolithic

  singleBinary:
    replicas: 1
    service:
      type: ClusterIP

  # Zero out all other replica sets
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

# ──────────────────────────────────────────────────────────────
# Prometheus + Grafana + Alertmanager - optional bundled install
# Set enabled: true for an all-in-one install.
# Set enabled: false and point config.alertmanagerUrl, web.prometheusUrl to your own alert_manager.
# ──────────────────────────────────────────────────────────────
kube-prometheus-stack:
  enabled: true

  grafana:
    enabled: false

  alertmanager:
    enabled: true
    alertmanagerSpec:
      retention: 1h
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ["..."]
        group_wait: 5s
        group_interval: 5s
        repeat_interval: 1h
        receiver: "null"  # default - silences all k8s/prometheus alerts
        routes:
          # Only WIMP alerts carry source="wimp" - route them to your receiver
          - matchers:
              - source = "wimp"
            receiver: "null"  # replace "null" with your receiver name, e.g. "telegram"
      receivers:
        - name: "null"
        # ── Add your receivers below for external alerting ─────────
        # Example:
        # - name: telegram
        #   telegram_configs:
        #     - bot_token: "YOUR_BOT_TOKEN"
        #       chat_id: YOUR_CHAT_ID  # supergroup ID (negative, prefixed with -100)
        #       parse_mode: HTML
        #       message: |
        #         {{ if eq .CommonLabels.severity "sev" }}🔴🔴 SEV+{{ else if eq .CommonLabels.severity "critical" }}🔴 CRITICAL{{ else if eq .CommonLabels.severity "warning" }}🟡 WARNING{{ else }}🔵 INFO{{ end }} // <b>{{ .GroupLabels.alertname }}</b>
        #         {{ range .Alerts }}
        #         <b>Summary:</b> {{ or .Annotations.summary "No summary" }}
        #         {{ if .GeneratorURL }}<a href="{{ .GeneratorURL }}">View in WIMP</a>{{ end }}
        #         {{ end }}

  prometheus:
    service:
      type: ClusterIP
    prometheusSpec:
      scrapeInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      retention: 7d
      # Windows-exporter HTTP service discovery via WIMP control plane.
      # Assumes release name "wimp" in the same namespace.
      # Override with --set if your release name differs.
      additionalScrapeConfigs:
        - job_name: windows_exporter
          scrape_interval: 30s
          http_sd_configs:
            - url: http://wimp-control-plane/prometheus/targets
              refresh_interval: 60s
          relabel_configs:
            - source_labels: [__address__]
              target_label: instance

        - job_name: blackbox_http
          metrics_path: /probe
          params:
            module: [http_2xx]
          http_sd_configs:
            - url: http://wimp-control-plane/prometheus/monitors
              refresh_interval: 60s
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: wimp-prometheus-blackbox-exporter:9115

  kube-state-metrics:
    enabled: false

  nodeExporter:
    enabled: false

# ──────────────────────────────────────────────────────────────
# Blackbox exporter - HTTP endpoint health probing
# ──────────────────────────────────────────────────────────────
prometheus-blackbox-exporter:
  enabled: true
