name: Build Agent

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-agent.yml'

env:
  VERSION: "1.0.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w -X github.com/su3i/wimp/internal/agent.Version=${{ env.VERSION }}" -o agent.exe ./cmd/agent/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: agent.exe
