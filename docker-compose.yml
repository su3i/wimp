# ──────────────────────────────────────────────────────────────
# WIMP - Docker Compose
#
# Core services (always started):
#   wimp-control-plane, wimp-web, postgres
#
# Observability stack (optional):
#   docker compose --profile observability up -d
#   Starts: loki, prometheus, alertmanager, grafana
#
# Copy .env.example → .env and fill in your values before starting.
# ──────────────────────────────────────────────────────────────

services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASEUSERNAME:-wimp}
      POSTGRES_PASSWORD: ${DATABASEPASSWORD:-wimp}
      POSTGRES_DB: ${DATABASENAME:-wimp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wimp

  # ── Control plane ────────────────────────────────────────────
  wimp-control-plane:
    image: darksueii/wimp:${WIMP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${WIMP_API_PORT:-8080}:8080"
    environment:
      APPENV: ${APPENV:-production}
      APPURL: ${APPURL:-http://localhost:8080}
      APPPORT: "8080"
      AGENTVERSION: ${AGENTVERSION:-0.0.5}
      ENFORCEMFA: ${ENFORCEMFA:-false}

      JWTSECRET: ${JWTSECRET}
      BOOTSTRAPTOKEN: ${BOOTSTRAPTOKEN}
      DEFAULTADMINUSERNAME: ${DEFAULTADMINUSERNAME:-admin}
      DEFAULTADMINPASSWORD: ${DEFAULTADMINPASSWORD}

      DATABASETYPE: postgres
      DATABASEHOST: ${DATABASEHOST:-postgres}
      DATABASEPORT: ${DATABASEPORT:-5432}
      DATABASENAME: ${DATABASENAME:-wimp}
      DATABASEUSERNAME: ${DATABASEUSERNAME:-wimp}
      DATABASEPASSWORD: ${DATABASEPASSWORD:-wimp}
      DATABASEUSESSL: ${DATABASEUSESSL:-false}

      # Point to your Loki instance, or to the bundled one when using --profile observability
      LOKIHOST: ${LOKIHOST:-loki}
      LOKIPORT: ${LOKIPORT:-3100}
      LOKITLSENABLED: ${LOKITLSENABLED:-false}
      LOKITLSSKIPVERIFY: ${LOKITLSSKIPVERIFY:-false}

      # Point to your Alertmanager, or to the bundled one when using --profile observability
      ALERTMANAGERURL: ${ALERTMANAGERURL:-http://alertmanager:9093}
    networks:
      - wimp

  # ── Web frontend ─────────────────────────────────────────────
  wimp-web:
    image: darksueii/wimp-web:${WIMP_WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - wimp-control-plane
    ports:
      - "${WIMP_WEB_PORT:-80}:80"
    environment:
      # Public URLs - must be reachable from the user's browser, not internal hostnames
      VITE_API_BASE_URL: ${APPURL:-http://localhost:8080}
      VITE_PROMETHEUS_URL: ${PROMETHEUS_URL:-}
    networks:
      - wimp

  # ── Loki ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - wimp

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wimp

  # ── Blackbox exporter ────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./deploy/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - wimp

  # ── Alertmanager ─────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - wimp

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Admin@1234}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    networks:
      - wimp

networks:
  wimp:
    driver: bridge

volumes:
  postgres_data:
  loki_data:
  prometheus_data:
  grafana_data:
